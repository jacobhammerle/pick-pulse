name: Deploy production

# Ships every push to main. The fingerprint decides how: when a store
# build with a matching fingerprint exists, publish an OTA update to the
# production channel; otherwise build a new store binary and submit it
# to TestFlight.

on:
  push:
    branches:
      - main

jobs:
  fingerprint:
    name: 1. Fingerprint the project
    type: fingerprint

  find_store_build:
    name: 2. Find a matching store build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      distribution: store
      channel: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  publish_update:
    name: 3. Ship an OTA update (JS only)
    needs: [find_store_build]
    if: ${{ needs.find_store_build.outputs.build_id }}
    type: update
    environment: production
    params:
      platform: ios
      channel: production
      message: ${{ github.commit_message }}

  build_production:
    name: 3. Build a new store build (native changed)
    needs: [find_store_build]
    if: ${{ !needs.find_store_build.outputs.build_id }}
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  submit_production:
    name: 4. Submit the build to TestFlight
    needs: [build_production]
    type: submit
    params:
      build_id: ${{ needs.build_production.outputs.build_id }}
      profile: production
