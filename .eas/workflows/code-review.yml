name: Code review

# Reviews every PR that targets main: Claude Code reads the diff and
# posts a review comment ending in a clear verdict.

on:
  pull_request:
    branches:
      - main

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  review_pr:
    name: Review the PR diff
    type: custom
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Review the diff and post a comment
        run: |
          # Public-repo guard: this step runs scripts from the PR's checked
          # out branch with this project's secrets in the environment. EAS
          # does not document how fork PRs are handled, so refuse any PR
          # whose head repo is detectably not this repo. When the field is
          # empty or uninterpolated we cannot tell, so continue (same-repo
          # PRs are the normal case and blocking them would break the
          # pipeline).
          HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          BASE_REPO="${{ github.repository }}"
          case "$HEAD_REPO" in
            ''|*'${{'*) echo "Head repo unknown; continuing." ;;
            "$BASE_REPO") ;;
            *) echo "PR head is fork '$HEAD_REPO'; refusing to run agent scripts with secrets."; exit 1 ;;
          esac
          # env: blocks pass template expressions through as literal text on
          # EAS right now, so resolve the context in the run script instead.
          export PR_NUMBER="${{ github.event.pull_request.number }}"
          export BASE_REF="${{ github.event.pull_request.base.ref }}"
          bash scripts/agent/review-pr.sh
