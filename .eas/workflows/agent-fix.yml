name: Agent fix

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: The GitHub issue number to fix
        type: string
        required: true

jobs:
  fix_issue:
    name: Fix issue and open PR
    type: custom
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Fix the issue and open a PR
        run: |
          # env: blocks pass template expressions through as literal text on
          # EAS right now, so resolve the input in the run script instead.
          ISSUE_NUMBER="${{ inputs.issue_number }}"
          # A numeric test catches every uninterpolated form, not just one
          # particular context name.
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "issue_number input not interpolated; using the newest open issue."
            ISSUE_NUMBER=$(node scripts/agent/gh.mjs latest-issue)
          fi
          export ISSUE_NUMBER
          bash scripts/agent/fix-issue.sh
