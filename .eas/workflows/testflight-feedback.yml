name: TestFlight feedback

on:
  app_store_connect:
    beta_feedback:
      types:
        - screenshot
        - crash

jobs:
  file_issue:
    name: File GitHub issue from feedback
    type: custom
    environment: production
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Create issue from feedback
        id: create_issue
        env:
          ASC_FEEDBACK_URL: ${{ app_store_connect.beta_feedback.url }}
        run: |
          # The trigger context only carries id/type/url, so fetch the full
          # submission (comment, tester, device, screenshots) by URL.
          FEEDBACK_JSON=$(npx --yes eas-cli@latest testflight:feedback "$ASC_FEEDBACK_URL" --json)
          export FEEDBACK_JSON
          ISSUE_NUMBER=$(node scripts/agent/create-issue-from-feedback.mjs)
          set-output issue_number "$ISSUE_NUMBER"

  dispatch_agent_fix:
    name: Dispatch agent fix
    needs: [file_issue]
    type: custom
    environment: production
    steps:
      - uses: eas/checkout
      - name: Run the agent-fix workflow
        run: |
          npx --yes eas-cli@latest workflow:run .eas/workflows/agent-fix.yml \
            --input issue_number=${{ needs.file_issue.outputs.issue_number }} \
            --non-interactive
