name: Agent iterate

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: The pull request number to iterate on
        type: string
        required: true
      instruction:
        description: The change the reviewer asked for
        type: string
        required: true

jobs:
  iterate_pr:
    name: Apply the requested change
    type: custom
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Apply the change and push
        run: |
          # env: blocks pass template expressions through as literal text on
          # EAS right now, so resolve inputs in the run script instead. The
          # instruction is free text, so read it via a quoted heredoc.
          export PR_NUMBER="${{ inputs.pr_number }}"
          INSTRUCTION=$(cat <<'INSTRUCTION_EOF'
          ${{ inputs.instruction }}
          INSTRUCTION_EOF
          )
          export INSTRUCTION
          if [[ "$PR_NUMBER" == *inputs* || -z "$PR_NUMBER" ]]; then
            echo "pr_number input not interpolated; cannot continue."
            exit 1
          fi
          bash scripts/agent/iterate-pr.sh
