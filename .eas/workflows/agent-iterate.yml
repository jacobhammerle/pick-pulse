name: Agent iterate

# Applies a reviewer-requested change to an open PR's branch: Claude Code
# makes the edit, verifies tsc passes, and pushes (or reports that no
# change was needed). The push re-triggers pr-verify and code-review.
# Dispatched by the /agent comment bridge
# (.github/workflows/eas-comment-bridge.yml), or run manually with
# pr_number and instruction inputs.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: The pull request number to iterate on
        type: string
        required: true
      instruction:
        description: The change the reviewer asked for
        type: string
        required: true

jobs:
  iterate_pr:
    name: Apply the requested change
    type: custom
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Apply the change and push
        run: |
          # env: blocks pass template expressions through as literal text on
          # EAS right now, so resolve inputs in the run script instead. The
          # instruction is free text, so read it via a quoted heredoc.
          export PR_NUMBER="${{ inputs.pr_number }}"
          INSTRUCTION=$(cat <<'INSTRUCTION_EOF'
          ${{ inputs.instruction }}
          INSTRUCTION_EOF
          )
          export INSTRUCTION
          # A numeric test catches every uninterpolated form, not just one
          # particular context name.
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_number input not interpolated; cannot continue."
            exit 1
          fi
          bash scripts/agent/iterate-pr.sh
