name: QA to Maestro

# Every PR ships with its own regression test: a QA agent tests what
# the PR's diff changed, a second agent authors a Maestro flow from
# the session log, and the flow is committed onto the PR branch.
# workflow_dispatch remains for manual runs (feature mode or PR mode).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      feature:
        description: The feature for the QA agent to test (optional when pr_number is set — defaults to the PR title)
        type: string
        required: false
      guidance:
        description: Optional extra instructions for the QA agent (expected values, boundaries, steps to include)
        type: string
        required: false
      pr_number:
        description: Optional PR number — the QA agent reads the PR diff and tests what it changed
        type: string
        required: false
      build_id:
        description: Optional build to test (e.g. the repack build from the PR's pr-verify run); overrides the build produced by this workflow
        type: string
        required: false

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  fingerprint:
    name: Fingerprint the project
    type: fingerprint

  find_simulator_build:
    name: Find a matching simulator build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview-simulator
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  repack_simulator_build:
    name: Repack the cached simulator build
    needs: [find_simulator_build]
    if: ${{ needs.find_simulator_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.find_simulator_build.outputs.build_id }}
      profile: preview-simulator
      js_bundle_only: true

  build_simulator_build:
    name: Build a new simulator app
    needs: [find_simulator_build]
    if: ${{ !needs.find_simulator_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview-simulator

  qa_and_author:
    name: QA agent explores, second agent writes the Maestro flow
    after: [repack_simulator_build, build_simulator_build]
    type: custom
    # production, not preview: GITHUB_TOKEN only exists there, and PR mode
    # (gh.mjs) needs it — same reason agent-fix and code-review use it.
    environment: production
    outputs:
      build_id: ${{ steps.qa.outputs.build_id }}
      slug: ${{ steps.qa.outputs.slug }}
      flow_b64: ${{ steps.qa.outputs.flow_b64 }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the QA agent, then author the flow
        id: qa
        run: |
          # env: blocks pass template expressions through as literal text on
          # EAS right now, so resolve the context in the run script instead.
          # Free-text inputs are read via quoted heredocs.
          WORKFLOW_BUILD_ID="${{ after.repack_simulator_build.outputs.build_id || after.build_simulator_build.outputs.build_id }}"
          BUILD_ID_INPUT="${{ inputs.build_id }}"
          PR_NUMBER_INPUT="${{ inputs.pr_number }}"
          PR_NUMBER_EVENT="${{ github.event.pull_request.number }}"
          FEATURE=$(cat <<'FEATURE_EOF'
          ${{ inputs.feature }}
          FEATURE_EOF
          )
          GUIDANCE=$(cat <<'GUIDANCE_EOF'
          ${{ inputs.guidance }}
          GUIDANCE_EOF
          )
          # Numeric tests catch every uninterpolated or empty form.
          [[ "$PR_NUMBER_INPUT" =~ ^[0-9]+$ ]] || PR_NUMBER_INPUT=""
          [[ "$PR_NUMBER_EVENT" =~ ^[0-9]+$ ]] || PR_NUMBER_EVENT=""
          case "$FEATURE" in *'${{'*) FEATURE="";; esac
          case "$GUIDANCE" in *'${{'*) GUIDANCE="";; esac
          case "$BUILD_ID_INPUT" in *'${{'*) BUILD_ID_INPUT="";; esac

          PR="${PR_NUMBER_EVENT:-$PR_NUMBER_INPUT}"

          # Loop guard: this workflow pushes a flow commit to the PR
          # branch, which re-triggers pull_request. If this PR's flow
          # already exists in the checkout, there is nothing to do.
          if [ -n "$PR" ] && ls .maestro/flows/pr-${PR}-*.yaml >/dev/null 2>&1; then
            echo "Flow for PR #${PR} already committed; skipping generation."
            exit 0
          fi

          # Build choice:
          # - explicit build_id input wins
          # - PR-triggered runs check out and build the PR's code, so the
          #   workflow's own build is the right one
          # - dispatch in PR mode leaves BUILD_ID unset so the script can
          #   find a build from the PR's head commit
          # - plain feature mode uses the workflow's build
          if [ -n "$BUILD_ID_INPUT" ]; then
            export BUILD_ID="$BUILD_ID_INPUT"
          elif [ -n "$PR_NUMBER_EVENT" ] || [ -z "$PR" ]; then
            export BUILD_ID="$WORKFLOW_BUILD_ID"
          fi
          if [ -n "$PR" ]; then
            export PR_NUMBER="$PR"
          fi
          if [ -z "$FEATURE" ] && [ -z "$PR" ]; then
            FEATURE="the pick slip payout flow"
          fi
          bash scripts/agent/qa-to-maestro.sh "$FEATURE" "$GUIDANCE"

          SLUG=$(cat qa-run/slug.txt)
          FLOW_PATH=$(cat qa-run/flow-path.txt)
          # The script records the build it actually tested (in PR mode it
          # may have picked a build from the PR's head commit).
          set-output build_id "$(cat qa-run/build-id.txt)"
          set-output slug "$SLUG"
          set-output flow_b64 "$(base64 < "$FLOW_PATH" | tr -d '\n')"
      - name: Ship the flow with the PR
        run: |
          # Skipped generation (loop guard) leaves no flow-path file.
          if [ ! -f qa-run/flow-path.txt ]; then
            echo "No new flow; nothing to ship."
            exit 0
          fi
          FLOW_PATH=$(cat qa-run/flow-path.txt)
          SLUG=$(cat qa-run/slug.txt)
          PR=$(cat qa-run/pr-number.txt 2>/dev/null || true)
          git config user.name "pickpulse-agent"
          git config user.email "agent@users.noreply.github.com"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GH_REPO}.git"
          if [ -n "$PR" ]; then
            # Commit the flow onto the PR branch: the feature and its
            # regression test merge together.
            PR_JSON=$(node scripts/agent/gh.mjs get-pr "$PR")
            BRANCH=$(node -e "console.log(JSON.parse(process.argv[1]).branch)" "$PR_JSON")
            git fetch "$REMOTE" "$BRANCH"
            # Force the branch tip; the untracked flow file survives.
            git checkout -f -B "$BRANCH" FETCH_HEAD
            git add "$FLOW_PATH"
            git commit -m "test: add agent-generated Maestro flow for PR #${PR}"
            git push "$REMOTE" "HEAD:${BRANCH}"
          else
            # Feature mode (no PR): propose the flow on its own branch.
            BRANCH="maestro/${SLUG}"
            git checkout -B "$BRANCH"
            git add "$FLOW_PATH"
            git commit -m "test: add generated Maestro flow ${SLUG}"
            if git push "$REMOTE" "HEAD:${BRANCH}"; then
              node scripts/agent/gh.mjs create-pr "$BRANCH" \
                "Add generated Maestro flow: ${SLUG}" \
                "This flow was authored by an agent from a QA session log on an EAS cloud simulator." \
                || echo "PR creation failed; the branch ${BRANCH} was pushed."
            else
              echo "Push failed; skipping the PR."
            fi
          fi

  run_maestro:
    name: Run the generated flow deterministically
    needs: [qa_and_author]
    if: ${{ needs.qa_and_author.outputs.flow_b64 }}
    type: maestro
    environment: preview
    params:
      build_id: ${{ needs.qa_and_author.outputs.build_id }}
      flow_path: .maestro/flows/generated.yaml
      record_screen: true
    hooks:
      after_checkout:
        - name: Materialize the generated flow
          run: |
            mkdir -p .maestro/flows
            # openssl decodes on both linux and macOS runners (base64 -d is GNU-only)
            echo "${{ needs.qa_and_author.outputs.flow_b64 }}" | openssl base64 -d -A > .maestro/flows/generated.yaml
            cat .maestro/flows/generated.yaml
