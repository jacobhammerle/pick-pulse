name: QA to Maestro

# On-demand, separate from the main PR flow (pr-verify stays fast).
# Point it at a PR: a QA agent reads the diff, tests what changed on
# an EAS cloud simulator, a second agent authors a Maestro flow from
# the session log, and the run SUGGESTS the test — a maestro/* branch
# PR plus a comment on the target PR with the flow inline. Nothing is
# pushed onto the target PR's branch.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number — the QA agent reads the PR diff and tests what it changed
        type: string
        required: false
      feature:
        description: Feature mode — describe what to QA instead of targeting a PR (optional when pr_number is set)
        type: string
        required: false
      guidance:
        description: Optional extra instructions for the QA agent (expected values, boundaries, steps to include)
        type: string
        required: false
      build_id:
        description: Optional build to test (e.g. the repack build from the PR's pr-verify run); overrides the build produced by this workflow
        type: string
        required: false

jobs:
  fingerprint:
    name: Fingerprint the project
    type: fingerprint

  find_simulator_build:
    name: Find a matching simulator build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview-simulator
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  repack_simulator_build:
    name: Repack the cached simulator build
    needs: [find_simulator_build]
    if: ${{ needs.find_simulator_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.find_simulator_build.outputs.build_id }}
      profile: preview-simulator
      js_bundle_only: true

  build_simulator_build:
    name: Build a new simulator app
    needs: [find_simulator_build]
    if: ${{ !needs.find_simulator_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview-simulator

  qa_and_author:
    name: QA agent explores, second agent writes the Maestro flow
    after: [repack_simulator_build, build_simulator_build]
    type: custom
    # production, not preview: GITHUB_TOKEN only exists there, and PR mode
    # (gh.mjs) needs it — same reason agent-fix and code-review use it.
    environment: production
    outputs:
      build_id: ${{ steps.qa.outputs.build_id }}
      slug: ${{ steps.qa.outputs.slug }}
      flow_b64: ${{ steps.qa.outputs.flow_b64 }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the QA agent, then author the flow
        id: qa
        run: |
          # env: blocks pass template expressions through as literal text on
          # EAS right now, so resolve the context in the run script instead.
          # Free-text inputs are read via quoted heredocs.
          WORKFLOW_BUILD_ID="${{ after.repack_simulator_build.outputs.build_id || after.build_simulator_build.outputs.build_id }}"
          BUILD_ID_INPUT="${{ inputs.build_id }}"
          PR_NUMBER_INPUT="${{ inputs.pr_number }}"
          FEATURE=$(cat <<'FEATURE_EOF'
          ${{ inputs.feature }}
          FEATURE_EOF
          )
          GUIDANCE=$(cat <<'GUIDANCE_EOF'
          ${{ inputs.guidance }}
          GUIDANCE_EOF
          )
          # A numeric test catches every uninterpolated or empty form.
          [[ "$PR_NUMBER_INPUT" =~ ^[0-9]+$ ]] || PR_NUMBER_INPUT=""
          case "$FEATURE" in *'${{'*) FEATURE="";; esac
          case "$GUIDANCE" in *'${{'*) GUIDANCE="";; esac
          case "$BUILD_ID_INPUT" in *'${{'*) BUILD_ID_INPUT="";; esac
          # A skipped or failed build job renders its output expression as
          # the literal string "undefined" — treat every non-UUID form as
          # empty so it can never reach build:view.
          case "$WORKFLOW_BUILD_ID" in *'${{'*|undefined|null) WORKFLOW_BUILD_ID="";; esac

          # Build choice:
          # - explicit build_id input wins
          # - PR mode leaves BUILD_ID unset so the script can find a build
          #   from the PR's head commit (a dispatch checks out main, so the
          #   workflow's own build may not contain the PR's changes)
          # - feature mode uses the workflow's build
          if [ -n "$BUILD_ID_INPUT" ]; then
            export BUILD_ID="$BUILD_ID_INPUT"
          elif [ -z "$PR_NUMBER_INPUT" ] && [ -n "$WORKFLOW_BUILD_ID" ]; then
            export BUILD_ID="$WORKFLOW_BUILD_ID"
          fi
          if [ -n "$PR_NUMBER_INPUT" ]; then
            export PR_NUMBER="$PR_NUMBER_INPUT"
          fi
          if [ -z "$FEATURE" ] && [ -z "$PR_NUMBER_INPUT" ]; then
            FEATURE="the pick slip payout flow"
          fi
          bash scripts/agent/qa-to-maestro.sh "$FEATURE" "$GUIDANCE"

          SLUG=$(cat qa-run/slug.txt)
          FLOW_PATH=$(cat qa-run/flow-path.txt)
          # The script records the build it actually tested (in PR mode it
          # may have picked a build from the PR's head commit).
          set-output build_id "$(cat qa-run/build-id.txt)"
          set-output slug "$SLUG"
          set-output flow_b64 "$(base64 < "$FLOW_PATH" | tr -d '\n')"
      - name: Suggest the flow (branch PR + comment)
        run: |
          FLOW_PATH=$(cat qa-run/flow-path.txt)
          SLUG=$(cat qa-run/slug.txt)
          PR=$(cat qa-run/pr-number.txt 2>/dev/null || true)
          VERDICT=$(grep -o 'RESULT: .*' qa-run/qa-report.md 2>/dev/null | head -1 || echo "RESULT: unknown")
          git config user.name "pickpulse-agent"
          git config user.email "agent@users.noreply.github.com"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GH_REPO}.git"
          BRANCH="maestro/${SLUG}"
          # The worker materializes the project as untracked files, so any
          # branch switch aborts on "would be overwritten by checkout".
          # Never switch branches: sync the index to HEAD (the files match
          # its tree, so status becomes clean), commit the flow on top, and
          # push the commit straight to the branch ref.
          git reset --mixed HEAD
          git add "$FLOW_PATH"
          git commit -m "test: add generated Maestro flow ${SLUG}"
          if ! git push "$REMOTE" "HEAD:refs/heads/${BRANCH}"; then
            echo "Push failed; the flow still ran in this workflow."
            exit 0
          fi
          SUGGEST_BODY="This flow was authored by an agent from a QA session log on an EAS cloud simulator. Merge it to add the test to the suite (.maestro/flows/ runs via maestro-e2e)."
          SUGGEST_URL=$(node scripts/agent/gh.mjs create-pr "$BRANCH" \
            "Add generated Maestro flow: ${SLUG}" "$SUGGEST_BODY" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                console.log(JSON.parse(d.trim().split('\n').pop()).url)})") \
            || { echo "PR creation failed; branch ${BRANCH} was pushed."; exit 0; }
          # In PR mode, leave the suggestion on the target PR too.
          if [ -n "$PR" ]; then
            FLOW_YAML=$(cat "$FLOW_PATH")
            node scripts/agent/gh.mjs comment "$PR" "## 🧪 Suggested Maestro regression test

          A QA agent tested this PR on an EAS cloud simulator (**${VERDICT}**), and a second agent authored a deterministic Maestro flow from the session log. The same run replayed the flow against the same build.

          Adopt it by merging ${SUGGEST_URL}

          <details><summary><code>${FLOW_PATH}</code></summary>

          \`\`\`yaml
          ${FLOW_YAML}
          \`\`\`

          </details>" || echo "PR comment failed; continuing."
          fi

  run_maestro:
    name: Run the generated flow deterministically
    needs: [qa_and_author]
    if: ${{ needs.qa_and_author.outputs.flow_b64 }}
    type: maestro
    environment: preview
    params:
      build_id: ${{ needs.qa_and_author.outputs.build_id }}
      flow_path: .maestro/flows/generated.yaml
      record_screen: true
    hooks:
      after_checkout:
        - name: Materialize the generated flow
          run: |
            mkdir -p .maestro/flows
            # openssl decodes on both linux and macOS runners (base64 -d is GNU-only)
            echo "${{ needs.qa_and_author.outputs.flow_b64 }}" | openssl base64 -d -A > .maestro/flows/generated.yaml
            cat .maestro/flows/generated.yaml
