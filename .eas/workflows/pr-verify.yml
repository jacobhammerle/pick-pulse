name: PR verify

# Verifies every PR that targets main on a real device: repack (or build)
# the PR's app, let an agent drive it on an EAS cloud simulator, publish
# the screenshot evidence to EAS Hosting, ship the PR as an OTA update on
# channel pr-N, and comment the results on the PR.

on:
  pull_request:
    branches:
      - main

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  fingerprint:
    name: Fingerprint the project
    type: fingerprint

  find_simulator_build:
    name: Find a matching simulator build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview-simulator
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  repack_simulator_build:
    name: Repack the cached simulator build
    needs: [find_simulator_build]
    if: ${{ needs.find_simulator_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.find_simulator_build.outputs.build_id }}
      profile: preview-simulator
      js_bundle_only: true

  build_simulator_build:
    name: Build a new simulator app
    needs: [find_simulator_build]
    if: ${{ !needs.find_simulator_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview-simulator

  verify_on_simulator:
    name: Verify on an EAS cloud simulator
    after: [repack_simulator_build, build_simulator_build]
    type: custom
    environment: preview
    outputs:
      evidence_url: ${{ steps.verify.outputs.evidence_url }}
      verdict: ${{ steps.verify.outputs.verdict }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Drive the app and collect evidence
        id: verify
        run: |
          # Public-repo guard: this step runs scripts from the PR's checked
          # out branch with this project's secrets in the environment. EAS
          # does not document how fork PRs are handled, so refuse any PR
          # whose head repo is detectably not the base repo. Both names come
          # from the same pull_request webhook payload; github.repository is
          # optional in the EAS context and arrives empty, which made this
          # guard reject same-repo PRs. When either name is empty or
          # uninterpolated we cannot tell, so continue (same-repo PRs are the
          # normal case and blocking them would break the pipeline).
          HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          BASE_REPO="${{ github.event.pull_request.base.repo.full_name }}"
          case "$HEAD_REPO$BASE_REPO" in *'${{'*) HEAD_REPO=''; BASE_REPO='' ;; esac
          if [ -z "$HEAD_REPO" ] || [ -z "$BASE_REPO" ]; then
            echo "Repo names unknown; continuing."
          elif [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "PR head is fork '$HEAD_REPO'; refusing to run agent scripts with secrets."
            exit 1
          fi
          # env: blocks pass template expressions through as literal text on
          # EAS right now, so resolve the context in the run script instead.
          # The PR title is free text, so read it via a quoted heredoc.
          export BUILD_ID="${{ after.repack_simulator_build.outputs.build_id || after.build_simulator_build.outputs.build_id }}"
          export PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE=$(cat <<'PR_TITLE_EOF'
          ${{ github.event.pull_request.title }}
          PR_TITLE_EOF
          )
          export PR_TITLE
          bash scripts/agent/verify-on-simulator.sh

  publish_pr_update:
    name: Publish an update to the pr channel
    needs: [verify_on_simulator]
    type: update
    environment: preview
    params:
      platform: ios
      channel: pr-${{ github.event.pull_request.number }}
      message: PR #${{ github.event.pull_request.number }} preview

  comment_on_pr:
    name: Comment the results on the PR
    needs: [verify_on_simulator, publish_pr_update]
    type: github-comment
    params:
      payload: |
        ## 🤖 Agent verification

        **Verdict:** ${{ needs.verify_on_simulator.outputs.verdict }}

        - 🖼️ **Evidence site** — screenshots from the simulator run: ${{ needs.verify_on_simulator.outputs.evidence_url }}
        - 📲 **Preview channel** — `pr-${{ github.event.pull_request.number }}`: open PickPulse → Settings, enter the channel name, tap **Switch channel** to try this PR on your phone

        _Posted by the pr-verify EAS workflow._
